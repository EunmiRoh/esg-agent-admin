# Supabase 무료 플랜은 약 7일간 요청이 없으면 프로젝트를 자동 일시정지한다.
# 매주 2회 읽기 전용 REST 요청을 보내 esg-platform DB(어드민·설문·자가진단 공용)가 멈추지 않게 한다.
# URL·anon 키는 index.html의 createClient 설정에서 읽는다(키를 이 파일에 중복 저장하지 않음).
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 0 * * 1,4'   # 월·목 09:17 KST
  workflow_dispatch:          # Actions 탭에서 수동 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: index.html
          sparse-checkout-cone-mode: false

      - name: Ping database
        run: |
          url=$(grep -oE "https://[a-z0-9]+\.supabase\.co" index.html | head -1)
          key=$(grep -A2 "createClient(" index.html | grep -oE "eyJ[A-Za-z0-9_.-]+" | head -1)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::index.html에서 Supabase 설정을 찾지 못했습니다."; exit 1
          fi
          for t in diagnosis_results stage5_learning; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 \
              "$url/rest/v1/$t?select=id&limit=1" -H "apikey: $key" -H "Authorization: Bearer $key")
            echo "$t -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::$t 응답 $code — 프로젝트가 일시정지됐을 수 있습니다. Supabase 대시보드에서 Restore 하세요."
              exit 1
            fi
          done
