# 매달 1일 Supabase DB 집계 스냅샷을 reports/db-snapshot/에 커밋한다.
# Claude 월간 점검 리포트(예약 작업)가 이 파일을 읽어 DB 수치를 보고한다(커넥터 불필요).
# 집계값만 저장하고 개인정보(기업명·전문가 이름/이메일·자유 의견·회의록 원문)는 저장하지 않는다.
# 매달 커밋이 생기므로 GitHub의 60일 무활동 예약 실행 중지도 함께 방지된다.
name: Monthly DB snapshot

on:
  schedule:
    - cron: '7 0 1 * *'   # 매달 1일 09:07 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build snapshot
        run: |
          mkdir -p reports/db-snapshot
          python3 .github/scripts/db_snapshot.py index.html reports/db-snapshot

      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/db-snapshot
          if git diff --cached --quiet; then echo '변경 없음'; exit 0; fi
          git commit -m "chore(report): 월간 DB 스냅샷 $(date -u +%Y-%m-%d)"
          git push
